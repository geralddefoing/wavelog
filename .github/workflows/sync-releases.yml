name: Sync WaveLog Upstream

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Add upstream
        run: |
          git remote add upstream https://github.com/wavelog/wavelog.git
          git fetch upstream --tags

      - name: Synchronize WaveLog
        run: |
          git checkout master
          git merge upstream/master --no-edit --no-commit

          git restore --staged .github/workflows 2>/dev/null || true
          git restore .github/workflows 2>/dev/null || true

          git commit -m "Sync WaveLog upstream" || true
          git push origin master
